name: open-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify-open-plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run privacy & secret release scanner
        run: python3 scripts/scan_before_release.py
